[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-context"
version = "0.1.0"
description = "Persistent, evidence-backed context for Devin across sessions, specifications, and repositories."
readme = "README.md"
requires-python = ">=3.8"
keywords = ["devin", "ai", "context", "specification", "openspec", "spec-kitty"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: JavaScript",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
devin-context = "devin_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["devin_context*"]

[tool.setuptools.package-data]
devin_context = [
    "py.typed",
    "_js/**/*",
    "_js/**",
]
